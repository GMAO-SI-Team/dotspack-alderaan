packages:
  all:
    providers:
      mpi: [openmpi]
      blas: [openblas]
      lapack: [openblas]

  apple-clang:
    externals:
    - spec: apple-clang@21.0.0
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/clang
          cxx: /usr/bin/clang++

  autoconf:
    externals:
    - spec: autoconf@2.73
      prefix: /Users/mathomp4/.homebrew/brew

  automake:
    externals:
    - spec: automake@1.20
      prefix: /Users/mathomp4/.homebrew/brew

  bash:
    externals:
    - spec: bash@5.3.20
      prefix: /Users/mathomp4/.homebrew/brew

  bison:
    externals:
    - spec: bison@2.3
      prefix: /usr

  cdo:
    variants: ~proj ~fftw3
    # cdo wanted a lot of extra stuff for proj and fftw3. Turn off for now

  cmake:
    externals:
    - spec: cmake@4.4.5
      prefix: /Users/mathomp4/.homebrew/brew

  curl:
    externals:
    - spec: curl@8.7.1+gssapi+ldap+nghttp2
      prefix: /usr

  cvs:
    externals:
    - spec: cvs@1.12.13
      prefix: /Users/mathomp4/.homebrew/brew

  doxygen:
    externals:
    - spec: doxygen@1.18.0+graphviz~mscgen
      prefix: /Users/mathomp4/.homebrew/brew

  esmf:
    require:
    - spec: +debug
      when: platform=darwin

  flex:
    externals:
    - spec: flex@2.6.4+lex
      prefix: /usr

  gcc:
    externals:
    - spec: gcc@12.5.0 languages:='c,c++,fortran'
      prefix: /Users/mathomp4/.homebrew/brew
      extra_attributes:
        compilers:
          c: /Users/mathomp4/.homebrew/brew/bin/gcc-12
          cxx: /Users/mathomp4/.homebrew/brew/bin/g++-12
          fortran: /Users/mathomp4/.homebrew/brew/bin/gfortran-12
    - spec: gcc@13.4.0 languages:='c,c++,fortran'
      prefix: /Users/mathomp4/.homebrew/brew
      extra_attributes:
        compilers:
          c: /Users/mathomp4/.homebrew/brew/bin/gcc-13
          cxx: /Users/mathomp4/.homebrew/brew/bin/g++-13
          fortran: /Users/mathomp4/.homebrew/brew/bin/gfortran-13
    - spec: gcc@14.4.0 languages:='c,c++,fortran'
      prefix: /Users/mathomp4/.homebrew/brew
      extra_attributes:
        compilers:
          c: /Users/mathomp4/.homebrew/brew/bin/gcc-14
          cxx: /Users/mathomp4/.homebrew/brew/bin/g++-14
          fortran: /Users/mathomp4/.homebrew/brew/bin/gfortran-14
    - spec: gcc@15.3.0 languages:='c,c++,fortran'
      prefix: /Users/mathomp4/.homebrew/brew
      extra_attributes:
        compilers:
          c: /Users/mathomp4/.homebrew/brew/bin/gcc-15
          cxx: /Users/mathomp4/.homebrew/brew/bin/g++-15
          fortran: /Users/mathomp4/.homebrew/brew/bin/gfortran-15
    - spec: gcc@16.2.0 languages:='c,c++,fortran'
      prefix: /Users/mathomp4/.homebrew/brew
      extra_attributes:
        compilers:
          c: /Users/mathomp4/.homebrew/brew/bin/gcc-16
          cxx: /Users/mathomp4/.homebrew/brew/bin/g++-16
          fortran: /Users/mathomp4/.homebrew/brew/bin/gfortran-16

  gettext:
    externals:
    - spec: gettext@1.0
      prefix: /Users/mathomp4/.homebrew/brew

  git-lfs:
    externals:
    - spec: git-lfs@3.8.1
      prefix: /Users/mathomp4/.homebrew/brew

  git:
    externals:
    - spec: git@2.56.1+tcltk
      prefix: /Users/mathomp4/.homebrew/brew
    - spec: git@2.54.0~tcltk
      prefix: /usr

  go:
    externals:
    - spec: go@1.27.4
      prefix: /Users/mathomp4/.homebrew/brew

  graphviz:
    externals:
    - spec: graphviz@16.1.1
      prefix: /Users/mathomp4/.homebrew/brew

  groff:
    externals:
    - spec: groff@1.25.0
      prefix: /Users/mathomp4/.homebrew/brew

  libpressio-tools:
    variants: +hdf5 +mpi +sperr

  libpressio:
    variants: +blosc +blosc2 +fpzip +hdf5 +mpi +netcdf +sz +sz3 +zfp

  libtool:
    externals:
    - spec: libtool@2.6.2
      prefix: /Users/mathomp4/.homebrew/brew

  llvm:
    externals:
    - spec: llvm@23.1.5 ~clang +flang
      prefix: /Users/mathomp4/.homebrew/brew
      extra_attributes:
        compilers:
          fortran: /Users/mathomp4/.homebrew/brew/bin/flang

  m4:
    externals:
    - spec: m4@1.4.6
      prefix: /usr

  mapl:
    variants: +pfunit

  mpi:
    require: openmpi+fortran

  netcdf-c:
    variants: +dap

  ninja:
    externals:
    - spec: ninja@1.13.2
      prefix: /Users/mathomp4/.homebrew/brew

  npm:
    externals:
    - spec: npm@11.20.0
      prefix: /Users/mathomp4/.homebrew/brew

  openblas:
    prefer:
    - build_system=cmake
    variants: ~dynamic_dispatch

  openmpi:
    # Note: NAG has a bug with Open MPI >= 5.0.8
    require:
    - +fortran
    - spec: '@5.0.7'
      when: '%nag'
    variants: +internal-hwloc +internal-libevent +internal-pmix

  openssh:
    externals:
    - spec: openssh@10.5p1
      prefix: /usr

  openssl:
    externals:
    - spec: openssl@4.1.0
      prefix: /Users/mathomp4/.homebrew/brew

  perl:
    externals:
    - spec: perl@5.34.1~cpanm+opcode+open+shared+threads
      prefix: /usr

  pkgconf:
    externals:
    - spec: pkgconf@3.0.10
      prefix: /Users/mathomp4/.homebrew/brew

  python:
    externals:
    - spec: python@3.15.2+bz2+ctypes+curses+dbm~freethreading+lzma+pyexpat~pythoncmd+readline+sqlite3+ssl~tkinter+uuid+zlib+zstd
      prefix: /Users/mathomp4/.homebrew/brew
    - spec: python@3.9.6+bz2+crypt+ctypes+curses+dbm+lzma+pyexpat~pythoncmd+readline+sqlite3+ssl+tix+tkinter+uuid+zlib
      prefix: /usr
    - spec: python@3.14.10+bz2+ctypes+dbm~freethreading+lzma+pyexpat~pythoncmd+readline+sqlite3+ssl~tkinter+uuid+zlib+zstd
      prefix: /Users/mathomp4/.homebrew/brew/opt/python@3.14
    buildable: false

  rust:
    externals:
    - spec: rust@1.99.1
      prefix: /Users/mathomp4/.homebrew/brew
      extra_attributes:
        cargo: /Users/mathomp4/.homebrew/brew/bin/cargo
        compilers:
          rust: /Users/mathomp4/.homebrew/brew/bin/rustc

  sperr:
    variants: ~openmp

  subversion:
    externals:
    - spec: subversion@1.15.0
      prefix: /Users/mathomp4/.homebrew/brew

  swig:
    externals:
    - spec: swig@4.5.1
      prefix: /Users/mathomp4/.homebrew/brew

  sz3:
    variants: +hdf5

  tcsh:
    externals:
    - spec: tcsh@6.24.16
      prefix: /Users/mathomp4/.homebrew/brew

  texinfo:
    externals:
    - spec: texinfo@7.3
      prefix: /Users/mathomp4/.homebrew/brew
